appId: com.localbard.app
productName: Local Bard
asar: true

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: windows-helper/publish/win-x64
    to: windows-helper
    filter:
      - "**/*"

# No auto-updater is configured, on purpose (v1 scope decision, see
# SECURITY.md). If auto-update is ever added later (e.g. via
# electron-updater), it MUST verify update package signatures before
# applying anything -- an unsigned or unverified update channel is a
# supply-chain attack vector that lets whoever controls the update feed run
# code on every installed copy of this app.

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
